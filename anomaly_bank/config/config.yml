data:
  path: "data/bank_transactions_data.csv"

isolation_forest:
  features:
    IP_Address_extract_level: 1
    freq_encoding_columns:
      - MerchantID
      - Location
      - IP_Address
      - IP_prefix_1
    one_hot_encoding_columns:
      - TransactionType
      - Channel
      - CustomerOccupation
    hash_columns:
      - name: DeviceID
        n_features: 10
    numerical_columns:
      - TransactionAmount
      - AccountBalance
      - TransactionDuration
      - LoginAttempts
      - CustomerAge
    datetime_columns:
      - TransactionDate
      - PreviousTransactionDate
  model:
    n_estimators: 100
    max_samples: "auto"
    contamination: 0.01
    random_state: 42
    feat_selection:
      median_weight: 0.4
      mean_weight: 0.4
      stdev_weight: -0.2